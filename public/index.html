<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nightly Numbers</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="wrap">
<div class="card">
  <h1>Nightly Numbers</h1>
  <div class="mute">Enter your branch's combined totals for the day.</div>
  <form id="f" autocomplete="off">
    <label for="branch">Branch</label><select id="branch" required></select>
    <label for="date">Date</label><input id="date" type="date" required>
    <div id="codeRow" hidden><label for="code">Access code</label><input id="code" type="password"></div>
    <div class="grid">
      <div><label for="knock">Knock</label><input id="knock" inputmode="numeric" placeholder="0"></div>
      <div><label for="talk">Talk</label><input id="talk" inputmode="numeric" placeholder="0"></div>
      <div><label for="walk">Walk</label><input id="walk" inputmode="numeric" placeholder="0"></div>
      <div><label for="contingency">Contingency</label><input id="contingency" inputmode="numeric" placeholder="0"></div>
      <div><label for="approved">Approved</label><input id="approved" inputmode="numeric" placeholder="0"></div>
      <div><label for="contracts">Contracts</label><input id="contracts" inputmode="numeric" placeholder="0"></div>
      <div><label for="revenue">Revenue ($)</label><input id="revenue" inputmode="decimal" placeholder="0.00"></div>
      <div><label for="soft_sets">Soft Sets</label><input id="soft_sets" inputmode="numeric" placeholder="0"></div>
    </div>
    <p class="mute" style="margin-bottom:0">Already sent today? Submitting again for the same branch and date replaces your earlier numbers.</p>
    <p><button type="submit" id="go">Submit numbers</button></p>
  </form>
  <div id="msg" role="status"></div>
</div></div>
<script>
const $ = (id) => document.getElementById(id);
const FIELDS = ['knock','talk','walk','contingency','approved','contracts','revenue','soft_sets'];
const msg = (t, ok) => { $('msg').className = 'msg ' + (ok ? 'ok' : 'err'); $('msg').textContent = t; };
try { $('code').value = localStorage.getItem('gmCode') || ''; } catch {}
fetch('/api/config').then(r => r.json()).then(c => {
  $('branch').innerHTML = '<option value="">Choose your branch…</option>' + c.branches.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
  $('date').value = $('date').max = c.today;
  $('codeRow').hidden = !c.needsCode;
  try { const s = localStorage.getItem('gmBranch'); if (s) $('branch').value = s; } catch {}
});
$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = { branchId: $('branch').value, date: $('date').value, code: $('code').value };
  FIELDS.forEach(k => body[k] = $(k).value);
  const name = $('branch').selectedOptions[0].textContent;
  if (!confirm(`Submit for ${name} on ${body.date}?\nKnock ${body.knock||0} · Talk ${body.talk||0} · Walk ${body.walk||0} · Contingency ${body.contingency||0}\nApproved ${body.approved||0} · Contracts ${body.contracts||0} · Revenue $${body.revenue||0} · Soft Sets ${body.soft_sets||0}`)) return;
  $('go').disabled = true;
  try {
    const r = await fetch('/api/submit', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    try { localStorage.setItem('gmBranch', body.branchId); if (body.code) localStorage.setItem('gmCode', body.code); } catch {}
    msg(`${d.updated ? 'Updated' : 'Received'} — ${name}, ${d.date}. Thank you!`, true);
    FIELDS.forEach(k => $(k).value = '');
  } catch (err) { msg(err.message, false); }
  $('go').disabled = false;
});
</script></body></html>
